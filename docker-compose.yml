version: "3.9"

services:
  postgres:
    image: postgres:16
    container_name: gatekeeper-postgres
    environment:
      POSTGRES_USER: gatekeeper
      POSTGRES_PASSWORD: gatekeeper
      POSTGRES_DB: gatekeeper
    ports:
      - "55432:5432"
    volumes:
      - gatekeeper_postgres_data:/var/lib/postgresql/data

volumes:
  gatekeeper_postgres_data: